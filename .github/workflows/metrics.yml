name: GitHub Metrics

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # allows to manually trigger the job
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: read
      actions: read
      discussions: read

    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@v3.34
        with:
          # NOTE: requires a *classic* PAT stored in METRICS_TOKEN.
          # Fine-grained tokens (including the default GITHUB_TOKEN) are
          # not supported because this action uses GraphQL.
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, summary, repositories, achievements
          plugin_languages: details
          plugin_languages_details: bytes-added, lines-added
          plugin_languages_limit: 8
          config_timezone: Asia/Shanghai
          committer_message: "chore(metrics): refresh github-metrics.svg"

      - name: Commit metrics SVG back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --staged --quiet || git commit -m "chore(metrics): refresh github-metrics.svg" || true
          git push
